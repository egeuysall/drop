# Docker Compose file for multi-service app:
# - web: Next.js app (port 3000)
# - api: Go API server (port 8080)
# - nginx: reverse proxy (ports 80/443)
# Volumes persist build artifacts and data. All services share 'app-network'.

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - ./apps/web/.env
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    volumes:
      - nextjs_static:/app/.next
    networks:
      - app-network
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    env_file:
      - ./apps/api/.env
    volumes:
      - go_data:/root/data
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apps/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web
    networks:
      - app-network

volumes:
  nextjs_static:
  go_data:

networks:
  app-network:
    driver: bridge
